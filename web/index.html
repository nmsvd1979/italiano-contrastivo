<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4965" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Italiano" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Italiano contrastivo</title>
    <script>
      /* Apariencia elegida en Ajustes (claro por defecto): se aplica antes de pintar para que no parpadee el modo del teléfono. */
      try {
        var t = localStorage.getItem("italiano-contrastivo.theme");
        if (t !== "auto") document.documentElement.setAttribute("data-theme", t === "oscuro" ? "dark" : "light");
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
