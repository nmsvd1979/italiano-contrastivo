name: gender_divergence
description: 'Palabras cuyo género o vocal final difiere del español. ''pianto/pianti'' se detecta por regex en la regla (no como participio de piangere: ''hanno pianto''). ''pianta/piante'' se retiraron:
  mismo género que ''planta''; ''pianto'' (sustantivo) se detecta por regla.'
