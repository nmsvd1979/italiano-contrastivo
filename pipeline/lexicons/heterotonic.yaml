name: heterotonic
description: 'Heterotónicas y falsos amigos prosódicos (acento distinto del español). Excluidas: atmosfera (IPA invertida en la fuente), telefono (misma sílaba tónica). ''oceano'' se retiró: auditores IA
  indican que comparte sílaba tónica con ''océano'' (docs/dudas-italiano.md #23).'
