name: vocab_a2
description: >-
  Vocabulario A2 por temas. Mismo formato que vocab_a1: forma|género|número|glosa en español neutro. Ninguna forma repite una de A1
  (lo vigila test_topic_codes). Solo palabras sueltas y sin verbos (el sustituto de un ejercicio de escucha debe conservar género,
  número y artículo). Los temas «falsos amigos» marcan en la glosa lo que NO significa la palabra para un hispanohablante.
  Elegidas el 2026-11-26 con el corpus de Tatoeba: cada palabra tiene al menos 3 oraciones candidatas (ver docs/acopio-a2.md).
topics:
