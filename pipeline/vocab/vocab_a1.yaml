name: vocab_a1
description: >-
  Vocabulario A1 por temas. Cada entrada: forma|género|número|glosa en español neutro (la forma es la que aparece en el texto;
  singular y plural son entradas separadas). El género y el número sirven para que la palabra sustituta de un ejercicio de escucha
  conserve el artículo correcto. Son palabras comunes del italiano estándar; la glosa es una traducción básica, sin matices.
