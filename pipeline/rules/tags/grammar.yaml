    - text: Sei una delle persone più intelligenti che io conosca.
      es: Eres una de las personas más listas que conozco.
      source: tatoeba:11370562
    negative:
    - text: Corri più veloce che puoi.
      es: Corre lo más rápido que puedas.
      source: tatoeba:633493
