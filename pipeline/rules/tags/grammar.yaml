    - text: La giuria era stata imparziale.
      es: El jurado fue imparcial.
      source: tatoeba:3348646
    - text: Mi siete mancate.
      es: Te eché de menos.
      source: tatoeba:2180670
    - text: Quanto lontano siete andate?
      es: ¿Hasta dónde llegaste?
      source: tatoeba:6482717
    negative:
    - text: Ieri sono andato a pescare al fiume.
      es: Fui a pescar al río ayer.
      source: tatoeba:503315
    - text: Sono andato allo zoo.
      es: Fui al zoológico.
      source: tatoeba:632259
    - text: Sono andato a camminare al parco.
      es: Fui al parque a darme un paseo.
      source: tatoeba:1648187
- id: participio_concuerda_con_clitico
  code: ERR_PARTICIPLE_AGREEMENT_CLITIC
  tier: grammar
  it:
  - regex: \b(?:lo|la|li|le|l'|ne)\s*(?:ho|hai|ha|abbiamo|avete|hanno|avevo|avevi|aveva|avevamo|avevate|avevano|avrò|avrai|avrà|avremo|avrete|avranno|avrei|avresti|avrebbe|avremmo|avreste|avrebbero)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?\w+(?:t|s)[aei]\b
  examples:
    positive:
    - text: Le ho viste oggi.
      es: Los he visto hoy.
      source: tatoeba:5723048
    - text: Perché l'ha lasciata da sola?
      es: ¿Por qué la dejaste sola?
      source: tatoeba:5677971
    - text: L'abbiamo studiata approfonditamente.
      es: Lo estudiamos a fondo.
      source: tatoeba:3108073
    negative:
    - text: Non ho visto il film e non voglio farlo.
      es: No he visto la película ni quiero hacerlo.
      source: tatoeba:1447225
    - text: Non ha visto nessuno.
      es: No ha visto a nadie.
      source: tatoeba:375386
    - text: Per cena ho mangiato solo un po' di frutta.
      es: Para cenar sólo tomé un poco de fruta.
      source: tatoeba:9440740
- id: avere_con_verbo_inergativo
  code: ERR_AUX_OVERGENERALIZATION
  tier: grammar
  it:
  - regex: \b(?:ho|hai|ha|abbiamo|avete|hanno|avevo|avevi|aveva|avevamo|avevate|avevano|avrò|avrai|avrà|avremo|avrete|avranno|avrei|avresti|avrebbe|avremmo|avreste|avrebbero)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?:camminat|dormit|lavorat|viaggiat|nuotat|pianto|riso|giocat|passeggiat|sorriso|telefonat|parlat|ballat|cantat)[oaie]?\b
  examples:
    positive:
    - text: Il bambino ha pianto tutta la notte.
      es: El bebé lloró toda la noche.
      source: tatoeba:624866
    - text: Per quanto tempo hai lavorato a Boston?
      es: ¿Por cuánto tiempo has trabajado en Boston?
      source: tatoeba:3696356
    - text: Non hanno viaggiato con loro a Werga.
      es: No viajaron con ellos a Werga.
      source: tatoeba:14000525
    negative:
    - text: Tom è andato a fare la spesa con Mary lo scorso fine settimana.
      es: Tom fue de compras con Mary el fin de semana.
      source: tatoeba:3354707
    - text: Sono arrivato alla stazione stamattina.
      es: Llegué a la estación esta mañana.
      source: tatoeba:5135149
    - text: È andato a casa tre ore dopo.
      es: Se fue a casa tres horas después.
      source: tatoeba:1517011
- id: riflessivo_con_essere
  code: ERR_REFLEXIVE_AUX
  tier: grammar
  it:
  - regex: \b(?:mi|ti|si|ci|vi)\s+(?:sono|sei|è|siamo|siete|ero|eri|era|eravamo|eravate|erano|sarò|sarai|sarà|saremo|sarete|saranno|sarei|saresti|sarebbe|saremmo|sareste|sarebbero|fui|fu|fummo|furono)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?\w+(?:at|ut|it)[oaie]\b
  examples:
    positive:
    - text: Tom si è dimenticato.
      es: A Tom se le olvidó.
      source: tatoeba:2191175
    - text: Lui si è innamorato di una donna più giovane.
      es: Se enamoró de una mujer más joven.
      source: tatoeba:3683231
    - text: Vi siete divertiti?
      es: ¿Lo pasasteis bien?
      source: tatoeba:2004952
    negative:
    - text: Quante mele ci sono?
      es: ¿Cuántas manzanas hay?
      source: tatoeba:1254517
    - text: Io ho affrontato il campione.
      es: Me enfrenté al campeón.
      source: tatoeba:1653863
    - text: Io ho studiato inglese per cinque anni.
      es: He estudiado inglés durante cinco años.
      source: tatoeba:375227
- id: pronomi_combinati
  code: ERR_CLITIC_COMBINED
  tier: grammar
  it:
  - regex: \b(?:glie(?:lo|la|li|le|ne)|(?:me|te|ce|ve)\s+(?:lo|la|li|le|ne))\b
  examples:
    positive:
    - text: Me lo hai già chiesto tre volte.
      es: Me lo has preguntado ya tres veces.
      source: tatoeba:5338900
    - text: Me ne voglio disfare.
      es: Quiero deshacerme de él.
      source: tatoeba:5508750
    - text: Dicono che se te lo sgrulli più di tre volte stai facendo un'altra cosa.
      es: Dicen que si te lo sacudes más de tres veces estás haciendo otra cosa.
      source: tatoeba:4045519
    negative:
    - text: Io non lo vedo da molto tempo.
      es: Hace mucho tiempo que no lo veo.
      source: tatoeba:2851744
    - text: Non mi piace più il Natale.
      es: Ya no me gusta la Navidad.
      source: tatoeba:4684722
    - text: Mi piace come sorridi.
      es: Me gusta cómo sonríes.
      source: tatoeba:600303
- id: ci_locativo
  code: ERR_CLITIC_CI
  tier: grammar
  it:
  - regex: \bci\s+(?:vado|vai|va|andiamo|andate|vanno|penso|pensi|pensa|pensiamo|pensate|pensano|credo|crede|metto|mette|torno|tornano|resto|resta|rimane|rimango)\b|\b(?:andarci|pensarci|crederci|starci|metterci|tornarci|restarci)\b|\bci\s+(?:sono|siamo|è|sei|siete)\s+(?:già\s+|mai\s+)?(?:stat[oaie]|andat[oaie])\b
  examples:
    positive:
    - text: Credo che dovremmo andarci.
      es: Creo que deberíamos ir allí.
      source: tatoeba:2305628
    - text: Vai a scuola a piedi o ci vai in bicicletta?
      es: ¿Vas a la escuela caminando o en bicicleta?
      source: tatoeba:1912825
    - text: Non pensarci neanche a mangiare la mia cioccolata!
      es: ¡Ni siquiera pienses en comerte mi chocolate!
      source: tatoeba:724343
    negative:
    - text: Non ci sono limiti.
      es: No hay límite.
      source: tatoeba:2523791
    - text: Ci siamo divertiti.
      es: Nos divertimos.
      source: tatoeba:3345480
    - text: In Giappone ci sono quattro stagioni.
      es: En Japón hay cuatro estaciones.
      source: tatoeba:969345
- id: ne_pronome
  code: ERR_CLITIC_NE
  tier: grammar
  it:
  - regex: (?<!\bse )(?<!\bce )(?<!\bme )(?<!\bte )(?<!\bve )(?<!\bsi )(?<!\bmi )(?<!\bti )(?<!\bci )(?<!\bvi )\bne\s+\w+|\bn'\s*(?:ho|hai|ha|abbiamo|avete|hanno)\b
  examples:
