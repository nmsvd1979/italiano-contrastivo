- id: aux_essere_movimento
  code: ERR_AUX_ESSERE
  tier: grammar
  it:
  - regex: \b(?:sono|sei|è|siamo|siete|ero|eri|era|eravamo|eravate|erano|sarò|sarai|sarà|saremo|sarete|saranno|sarei|saresti|sarebbe|saremmo|sareste|sarebbero|fui|fu|fummo|furono)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?:andat|venut|partit|arrivat|tornat|ritornat|uscit|entrat|salit|scesi|scend|cadut|nat|mort|rimast|diventat|stat|successo|cresciut|piaciut|costat|riuscit|sparit|fuggit|passat)[oaie]\b
  examples:
    positive:
    - text: È andata a fare acquisti.
      es: Ella fue de compras.
      source: tatoeba:2991318
    - text: Il tuo cane è nato quest'anno.
      es: Tu perro nació este año.
      source: tatoeba:1272066
    - text: Sono entrate.
      es: Entraron.
      source: tatoeba:5717481
    negative:
    - text: Mi hai beccato.
      es: Me has pescado.
      source: tatoeba:3356709
    - text: Ha cominciato a imparare l'esperanto.
      es: Él ha comenzado a aprender el Esperanto.
      source: tatoeba:1097835
    - text: Abbiamo imparato un sacco di cose!
      es: ¡Hemos aprendido un montón de cosas!
      source: tatoeba:2825610
- id: participio_concuerda_con_essere
  code: ERR_PARTICIPLE_AGREEMENT
  tier: grammar
  it:
  - regex: \b(?:sono|sei|è|siamo|siete|ero|eri|era|eravamo|eravate|erano|sarò|sarai|sarà|saremo|sarete|saranno|sarei|saresti|sarebbe|saremmo|sareste|sarebbero|fui|fu|fummo|furono)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?:andat|venut|partit|arrivat|tornat|ritornat|uscit|entrat|salit|scesi|scend|cadut|nat|mort|rimast|diventat|stat|successo|cresciut|piaciut|costat|riuscit|sparit|fuggit|passat|\w+[ai]t|\w+[ui]t)[aei]\b
  examples:
    positive:
    - text: La giuria era stata imparziale.
      es: El jurado fue imparcial.
      source: tatoeba:3348646
    - text: Mi siete mancate.
      es: Te eché de menos.
      source: tatoeba:2180670
    - text: Quanto lontano siete andate?
      es: ¿Hasta dónde llegaste?
      source: tatoeba:6482717
    negative:
    - text: Ieri sono andato a pescare al fiume.
      es: Fui a pescar al río ayer.
      source: tatoeba:503315
    - text: Sono andato allo zoo.
      es: Fui al zoológico.
      source: tatoeba:632259
    - text: Sono andato a camminare al parco.
      es: Fui al parque a darme un paseo.
      source: tatoeba:1648187
- id: participio_concuerda_con_clitico
  code: ERR_PARTICIPLE_AGREEMENT_CLITIC
  tier: grammar
  it:
  - regex: \b(?:lo|la|li|le|l'|ne)\s*(?:ho|hai|ha|abbiamo|avete|hanno|avevo|avevi|aveva|avevamo|avevate|avevano|avrò|avrai|avrà|avremo|avrete|avranno|avrei|avresti|avrebbe|avremmo|avreste|avrebbero)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?\w+(?:t|s)[aei]\b
