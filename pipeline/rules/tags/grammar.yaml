    - text: Ne ho vista una oggi.
      es: Hoy vi uno.
      source: tatoeba:6776227
    - text: Ne abbiamo un sacco.
      es: Tenemos bastante.
      source: tatoeba:6551096
    - text: Ne parlate come se fosse un evento importante.
      es: No habléis como si fuese un evento importante.
      source: tatoeba:11856753
    negative:
    - text: Quanti piani ha questo edificio?
      es: ¿Cuántos pisos tiene este edificio?
      source: tatoeba:1534880
    - text: Io ho tre cugini.
      es: Tengo tres primos.
      source: tatoeba:1307429
    - text: Non ci sono vie d'uscita.
      es: No hay salida.
      source: tatoeba:3542330
- id: ce_ne
  code: ERR_CLITIC_CE_NE
  tier: grammar
  it:
  - regex: \bce\s+ne\b|\bce\s+n'
  examples:
    positive:
    - text: Ce ne sono più fuori che dentro.
      es: Hay más fuera que dentro.
      source: tatoeba:6587148
    - text: Ce ne andiamo domani pomeriggio.
      es: Partimos mañana por la tarde.
      source: tatoeba:5528254
    - text: Noi ce ne andiamo da Boston domani mattina.
      es: Nos vamos de Boston mañana por la mañana.
      source: tatoeba:4612450
    negative:
    - text: Non ci sono differenze.
      es: No hay diferencia.
      source: tatoeba:2523778
    - text: Ci sono molti strumenti nella scatola.
      es: Hay muchas herramientas en la caja.
      source: tatoeba:3696208
    - text: Ci sono molti libri in biblioteca.
      es: Hay muchos libros en la biblioteca.
      source: tatoeba:1260543
- id: clitico_diretto_indiretto
