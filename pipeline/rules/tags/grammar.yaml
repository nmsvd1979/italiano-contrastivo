      source: tatoeba:1213071
    - text: Gli manca la disciplina.
      es: Le hace falta disciplina.
      source: tatoeba:646997
    negative:
    - text: La casa che Tom ha costruito è meravigliosa.
      es: La casa que Tom construyó es maravillosa.
      source: tatoeba:1064165
    - text: Non mi piace bere caffè.
      es: No me gusta beber café.
      source: tatoeba:1002997
    - text: Mi piace il cibo egiziano.
      es: Me gusta la comida egipcia.
      source: tatoeba:999974
- id: pronome_indiretto_genere
  code: ERR_INDIRECT_PRONOUN_GENDER
  tier: grammar
  it:
  - matcher:
    - LOWER:
        IN:
        - gli
        - le
