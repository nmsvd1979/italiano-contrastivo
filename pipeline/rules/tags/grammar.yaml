- id: congiuntivo_dopo_opinione
  code: ERR_CONGIUNTIVO_OPINION
  tier: grammar
  it:
  - matcher:
    - LOWER:
        IN:
        - credo
        - crede
        - credi
        - crediamo
        - credete
        - credono
        - penso
        - pensi
        - pensa
        - pensiamo
        - pensate
        - pensano
        - ritengo
        - ritiene
        - immagino
        - suppongo
        - ritieni
    - LOWER: che
    - OP: '{0,3}'
    - &id001
      MORPH:
        IS_SUPERSET:
        - Mood=Sub
  examples:
    positive:
    - text: Penso che sia impossibile per noi sconfiggere Tom.
      es: Pienso que es imposible para nosotros vencer a Tom.
      source: tatoeba:10461739
    - text: Penso che lei sia l'unica a cui importa.
      es: Creo que usted es la única a la que le importa.
      source: tatoeba:2459056
    - text: Penso che voi stiate facendo un errore.
      es: Creo que estás cometiendo un error.
      source: tatoeba:2789000
    negative:
    - text: Penso di essere sbronzo.
      es: Creo que estoy borracho.
      source: tatoeba:3950297
    - text: Penso di aver fatto un grosso errore.
      es: Creo que he cometido un gran error.
      source: tatoeba:2477571
    - text: Penso di aver capito.
      es: Yo creo que comprendí.
      source: tatoeba:335156
- id: congiuntivo_concessiva
  code: ERR_CONGIUNTIVO_CONCESSIVE
  tier: grammar
  it:
  - matcher:
    - LOWER:
        IN:
        - sebbene
        - benché
        - benche
        - nonostante
        - malgrado
    - OP: '{0,5}'
    - *id001
  examples:
    positive:
    - text: Benché sia giovane, è un ottimo medico.
      es: Pese a ser joven, es un médico notable.
      source: tatoeba:2055834
    - text: Nonostante sia giovane è molto attento.
      es: Pese a ser joven, es muy atento.
      source: tatoeba:4652738
    - text: Sebbene le battute di Mary siano molto creative, non hanno grazia.
      es: Aunque los chistes de Mary son muy creativos, no tienen gracia.
      source: tatoeba:11706853
    negative:
    - text: Ha iniziato nonostante la pioggia.
      es: Empezó a pesar de la lluvia.
      source: tatoeba:2800920
    - text: La vittoria è possibile, benché poco probabile.
      es: La victoria es posible, aunque poco probable.
      source: tatoeba:1310191
    - text: Nonostante la sua età, egli è in salute e attivo.
      es: A pesar de su edad, él es sano y activo.
      source: tatoeba:5873705
- id: congiuntivo_impersonale
  code: ERR_CONGIUNTIVO_IMPERSONAL
  tier: grammar
  it:
  - matcher:
    - LOWER:
        IN:
        - sembra
        - pare
        - sembrava
        - pareva
        - sembrerebbe
    - LOWER: che
    - OP: '{0,3}'
    - *id001
  - matcher:
    - LOWER: è
    - LOWER:
        IN:
        - possibile
