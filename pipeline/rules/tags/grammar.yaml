      es: Los he visto hoy.
      source: tatoeba:5723048
    - text: Perché l'ha lasciata da sola?
      es: ¿Por qué la dejaste sola?
      source: tatoeba:5677971
    - text: L'abbiamo studiata approfonditamente.
      es: Lo estudiamos a fondo.
      source: tatoeba:3108073
    negative:
    - text: Non ho visto il film e non voglio farlo.
      es: No he visto la película ni quiero hacerlo.
      source: tatoeba:1447225
    - text: Non ha visto nessuno.
      es: No ha visto a nadie.
      source: tatoeba:375386
    - text: Per cena ho mangiato solo un po' di frutta.
      es: Para cenar sólo tomé un poco de fruta.
      source: tatoeba:9440740
- id: avere_con_verbo_inergativo
  code: ERR_AUX_OVERGENERALIZATION
  tier: grammar
  it:
  - regex: \b(?:ho|hai|ha|abbiamo|avete|hanno|avevo|avevi|aveva|avevamo|avevate|avevano|avrò|avrai|avrà|avremo|avrete|avranno|avrei|avresti|avrebbe|avremmo|avreste|avrebbero)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?:camminat|dormit|lavorat|viaggiat|nuotat|passeggiat|corso)[oaie]?\b
  examples:
    positive:
    - text: Per quanto tempo hai lavorato a Boston?
      es: ¿Por cuánto tiempo has trabajado en Boston?
      source: tatoeba:3696356
    - text: Non hanno viaggiato con loro a Werga.
      es: No viajaron con ellos a Werga.
      source: tatoeba:14000525
    - text: Lei ha dormito bene?
      es: ¿Has dormido bien?
      source: tatoeba:2941986
    - text: Lui ha viaggiato a bordo di un treno speciale.
      es: Viajó en un tren especial.
      source: tatoeba:3984992
    - text: Ha mai nuotato in questo lago?
      es: ¿Ha nadado alguna vez en este lago?
      source: tatoeba:8161467
    negative:
    - text: Tom è andato a fare la spesa con Mary lo scorso fine settimana.
      es: Tom fue de compras con Mary el fin de semana.
      source: tatoeba:3354707
    - text: Sono arrivato alla stazione stamattina.
      es: Llegué a la estación esta mañana.
      source: tatoeba:5135149
    - text: È andato a casa tre ore dopo.
      es: Se fue a casa tres horas después.
      source: tatoeba:1517011
    - text: Il film era così triste che tutti hanno pianto.
      es: La película era tan triste que todos lloraron.
      source: tatoeba:381874
    - text: Tom non ne ha parlato con nessuno.
      es: Tom no ha hablado de ello con nadie.
      source: tatoeba:6047086
    - text: Ho pianto come un bambino quando il ragazzo e il suo cane si sono riuniti alla fine del film.
      es: Lloré como un bebé cuando el niño y su perro se reencontraron al final de la película.
      source: tatoeba:653710
    - text: Ne ho appena parlato con loro.
      es: Acabo de hablar con ellos de eso.
      source: tatoeba:7739847
- id: riflessivo_con_essere
  code: ERR_REFLEXIVE_AUX
  tier: grammar
  it:
  - regex: \b(?:mi|ti|si|vi)\s+(?:sono|sei|è|siamo|siete|ero|eri|era|eravamo|eravate|erano|sarò|sarai|sarà|saremo|sarete|saranno|sarei|saresti|sarebbe|saremmo|sareste|sarebbero|fui|fu|fummo|furono)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?!stat[oaie]\b)(?!piaciut|mancat|sembrat|capitat|bastat|servit|volut)\w+(?:at|ut|it)[oaie]\b|\bci\s+(?:siamo|eravamo|saremo|saremmo|fummo)\s+(?:(?:non|già|appena|mai|sempre|ancora|poi|più|subito|spesso|quasi)\s+)?(?!stat[oaie]\b)(?!piaciut|mancat|sembrat|capitat|bastat|servit|volut)\w+(?:at|ut|it)[oaie]\b
  examples:
    positive:
    - text: Tom si è dimenticato.
      es: A Tom se le olvidó.
      source: tatoeba:2191175
    - text: Lui si è innamorato di una donna più giovane.
      es: Se enamoró de una mujer más joven.
      source: tatoeba:3683231
    - text: Vi siete divertiti?
      es: ¿Lo pasasteis bien?
      source: tatoeba:2004952
    negative:
    - text: Quante mele ci sono?
      es: ¿Cuántas manzanas hay?
      source: tatoeba:1254517
    - text: Io ho affrontato il campione.
      es: Me enfrenté al campeón.
      source: tatoeba:1653863
    - text: Io ho studiato inglese per cinque anni.
      es: He estudiado inglés durante cinco años.
      source: tatoeba:375227
    - text: Ci sono stati molti colpi di scena nella storia, ma finalmente abbiamo risolto il problema.
      es: Hubo muchos vuelcos y giros a la historia, pero finalmente resolvimos el problema.
      source: tatoeba:1851309
    - text: Di recente, ci sono stati segnali che l'economia sta riprendendo vigore.
      es: Recientemente, ha habido señales de que la economía está tomando vuelo.
      source: tatoeba:2003332
    - text: Mi è piaciuta la tua idea e l'ho adottata.
      es: Me gustó tu idea y la adopté.
      source: tatoeba:2143646
    - text: '"Sei mai stata a New York?" "Sì, ci sono stata un paio di volte."'
      es: '"¿Estuviste alguna vez en Nueva York?" "Si, estuve allí un par de veces."'
      source: tatoeba:2148295
    - text: '"È mai stata a New York?" "Sì, ci sono stata un paio di volte."'
      es: '"¿Estuviste alguna vez en Nueva York?" "Si, estuve allí un par de veces."'
      source: tatoeba:2148297
    - text: Questo mese ci sono stati due omicidi.
      es: Hubo dos asesinatos este mes.
      source: tatoeba:2198710
    - text: Le ci sono voluti sei anni per trovare il coraggio di dirgli che non le piaceva più.
      es: Le tomó seis años reunir el coraje para decirle que ya no le gustaba.
      source: tatoeba:3713296
    - text: I miei genitori sono andati in casa, ma io non ci sono andato.
      es: Mis padres fueron a la iglesia, pero yo no fui.
      source: tatoeba:6143262
    - text: I miei genitori sono andati in casa, ma io non ci sono andata.
      es: Mis padres fueron a la iglesia, pero yo no fui.
      source: tatoeba:6143264
    - text: I miei genitori sono andati in casa, però io non ci sono andato.
      es: Mis padres fueron a la iglesia, pero yo no fui.
      source: tatoeba:6143265
- id: pronomi_combinati
  code: ERR_CLITIC_COMBINED
  tier: grammar
  it:
  - regex: \b(?:glie(?:lo|la|li|le|ne)|(?:me|te|ve)\s+(?:lo|la|li|le))\b
  examples:
    positive:
    - text: Me lo hai già chiesto tre volte.
      es: Me lo has preguntado ya tres veces.
      source: tatoeba:5338900
    - text: Dicono che se te lo sgrulli più di tre volte stai facendo un'altra cosa.
      es: Dicen que si te lo sacudes más de tres veces estás haciendo otra cosa.
      source: tatoeba:4045519
    - text: Glielo darò domani.
      es: Se lo daré mañana.
      source: tatoeba:844334
    - text: Te la sto dando gratuitamente.
      es: Te lo doy gratis.
      source: tatoeba:4649388
    negative:
    - text: Io non lo vedo da molto tempo.
      es: Hace mucho tiempo que no lo veo.
      source: tatoeba:2851744
    - text: Non mi piace più il Natale.
      es: Ya no me gusta la Navidad.
      source: tatoeba:4684722
    - text: Mi piace come sorridi.
      es: Me gusta cómo sonríes.
      source: tatoeba:600303
    - text: Dentro ogni uomo ce ne sono migliaia.
      es: Dentro de cada hombre hay miles.
      source: tatoeba:12337626
    - text: Ce ne andiamo dal Giappone il mese prossimo.
      es: Nos vamos de Japón el mes próximo.
      source: tatoeba:12899533
    - text: Per me è finita con le feste, il mio corpo malato non ce la fa più.
      es: Se terminaron para mí todas las farras, mi cuerpo enfermo no resiste más.
      source: tatoeba:13694648
    - text: Che ora sarebbe quando ce ne andiamo dal ristorante?
      es: ¿Qué hora sería cuando salimos del restaurante?
      source: tatoeba:1839408
    - text: Me ne hanno parlato e l'ho dimenticato; l'ho visto e l'ho capito; l'ho fatto e l'ho imparato.
      es: Me lo contaron y lo olvidé; lo vi y lo entendí; lo hice y lo aprendí.
      source: tatoeba:10582587
    - text: Non ce ne frega un cazzo.
      es: No nos importa un carajo.
      source: tatoeba:2795896
- id: ci_locativo
