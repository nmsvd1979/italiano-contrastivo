      source: tatoeba:1640265
    - text: Tom è più giovane di quel che pensi.
      es: Tom es más joven de lo que piensas.
      source: tatoeba:2780893
    - text: È più difficile di quello che pensi.
      es: Es más difícil de lo que crees.
      source: tatoeba:4676
    - text: Tom è più veloce di quello che pensi.
      es: Tomás es más rápido de lo que pensás.
      source: tatoeba:5090190
    - text: Penso che questa sia la parte migliore del film.
      es: Creo que esta es la mejor parte de la película.
      source: tatoeba:3770405
- id: a_personale
  code: ERR_PERSONAL_A
  tier: grammar
  it:
  - regex: \b(?:aspett|cerc|chiam|ved|aiut|conosc|incontr|abbracc|invit)\w*\b(?!\s+(?:a|di|da|in|con|per|su)\b)
  es:
  - regex: \b(?:espero|busco|llamo|veo|ayudo|escucho|conozco|encuentro|visito|abrazo|invito|espera|busca|llama|ve|ayuda|escucha|conoce|encuentra|visita|esperamos|buscamos|llamamos|vemos|ayudamos|esperan|buscan|llaman|ven|ayudan|esperando|buscando|llamando|viendo|ayudando|escuchando)\s+a\s+(?:mi|tu|su|mis|tus|sus|la|el|los|las|un|una|Tom|Mary|María|Maria|Juan|Pedro|Ana|Paco)\b
  examples:
    positive:
    - text: Vedo Tom ogni giorno.
      es: Veo a Tom todos los días.
      source: tatoeba:2023154
    - text: Tom sta cercando suo figlio.
      es: Tom está buscando a su hijo.
      source: tatoeba:6678726
    - text: Io sto aspettando il mio fidanzato.
      es: Estoy esperando a mi novio.
      source: tatoeba:2034841
    negative:
    - text: Io ho chiesto aiuto a Bob.
      es: Le pedí ayuda a Bob.
      source: tatoeba:4871799
    - text: Non ho visto il film e non voglio farlo.
      es: No he visto la película ni quiero hacerlo.
      source: tatoeba:1447225
    - text: Abbiamo imparato un sacco di cose!
      es: ¡Hemos aprendido un montón de cosas!
      source: tatoeba:2825610
    - text: Faccio visita ai miei nonni due volte alla settimana.
      es: Visito a mis abuelos dos veces a la semana.
      source: tatoeba:828427
    - text: Ha ascoltato la mia opinione.
      es: Escuchó mi opinión.
      source: tatoeba:377551
    - text: Sto ascoltando l'ultima canzone di Björk.
      es: Estoy escuchando la última canción de Björk.
      source: tatoeba:511338
- id: pensare_a
  code: ERR_PREP_PENSARE
  tier: grammar
  it:
  - regex: \bpens(?:o|i|a|iamo|ate|ano|are|ando|avo|avi|ava|ò)\s+(?:a|alla|al|allo|ai|agli|alle|all')\b
  examples:
    positive:
    - text: Vorrei poter pensare a qualcosa da dire.
      es: Ojalá pudiera pensar en algo que decir.
      source: tatoeba:701430
    - text: Pensiamo alla strage?
      es: ¿Pensamos en la masacre?
      source: tatoeba:2134602
    - text: Non posso pensare a tutto.
      es: No puedo pensar en todo.
      source: tatoeba:634416
    negative:
    - text: Penso di aver fatto un grosso errore.
      es: Creo que he cometido un gran error.
      source: tatoeba:2477571
    - text: Io penso che Tom potrebbe avere finalmente una buona idea.
      es: Creo que Tom podría tener una buena idea finalmente.
      source: tatoeba:4963908
    - text: Pensate che dovrei fermarla?
      es: ¿Crees que debería detenerla?
      source: tatoeba:6292704
    - text: Non pensarci troppo.
      es: No pienses demasiado al respecto.
      source: tatoeba:1664658
    - text: Non pensarci neanche.
      es: Ni lo pienses.
      source: tatoeba:2741408
    - text: Non pensarci due volte, Tom.
      es: No te lo pienses dos veces, Tom.
      source: tatoeba:3050258
    - text: Non pensarci ora.
      es: No piense ahora en eso.
      source: tatoeba:3334689
