# Umbrales de nivel CEFR (Fase 2, spec §"Estimación de nivel CEFR"). Punto de partida: se ajusta con la revisión.
# Nivel de la oración = el más alto entre sus rasgos; después, un ajuste por rareza léxica.
levels: [A1, A2, B1, B2]

features:               # rasgo → nivel mínimo
  passato_prossimo: A2
  passato_finito: A2            # passato remoto (Tense=Past finito)
  imperfetto: A2                # Tense=Imp
  futuro: A2                    # Tense=Fut
  condizionale_presente: A2
  imperativo: A2
  condizionale_passato: B1
  trapassato_prossimo: B1
  congiuntivo: B1               # presente o imperfetto
  congiuntivo_passato: B1
  passivo: B1
  pronomi_combinati: B1
  ne_partitivo: B1
  congiuntivo_trapassato: B2
  periodo_ipotetico_irreale: B2
  concessiva_congiuntivo: B2
  gerundio_assoluto: B2

length_bands:           # palabras (sin puntuación); el primer tramo con n <= max fija el nivel mínimo
  - {max: 6,   level: A1}
  - {max: 10,  level: A2}
  - {max: 16,  level: B1}
  - {max: 999, level: B2}

rarity:                 # si el percentil indicado de Zipf (wordfreq 'it') de los lemas cae bajo el umbral, sube un nivel
  percentile: 90
  zipf_below: 3.5
  pos: [NOUN, VERB, ADJ, ADV]

confidence: {high: 0.9, medium: 0.6, low: 0.3}

concessive_conjunctions: [sebbene, benché, nonostante, malgrado]
