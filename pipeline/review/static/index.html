<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de oraciones</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --card:#fff; --line:#dedbd2; --ok:#1f7a4d; --bad:#b3261e; --warn:#8a5a00; --accent:#2b5fd9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecebe6; --muted:#a09f98; --card:#1f1f1c; --line:#38372f; --ok:#5fcf9a; --bad:#ff8a80; --warn:#f0c26b; --accent:#8ab0ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:1rem; }
  header { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem; margin-top:1rem; }
  .it { font-size:1.6rem; line-height:1.35; margin:0 0 .25rem; }
  .es { font-size:1.15rem; color:var(--muted); margin:0 0 1rem; }
  .meta { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:.1rem .6rem; font-size:.85rem; }
  .chip.warn { color:var(--warn); border-color:var(--warn); }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 1rem; padding:.6rem .8rem; }
  legend { color:var(--muted); font-size:.85rem; padding:0 .3rem; }
  label { display:flex; gap:.5rem; align-items:flex-start; padding:.2rem 0; }
  code { font-size:.85rem; color:var(--muted); }
  .actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1rem; }
  button { font:inherit; padding:.6rem 1rem; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; min-height:44px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .approve { border-color:var(--ok); color:var(--ok); } .reject { border-color:var(--bad); color:var(--bad); }
  kbd { font:inherit; font-size:.75rem; border:1px solid var(--line); border-radius:4px; padding:0 .3rem; margin-left:.3rem; color:var(--muted); }
  input[type=text], select { font:inherit; padding:.4rem .5rem; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .toolbar { display:flex; gap:1rem; align-items:center; margin-top:.5rem; font-size:.9rem; } .toolbar button { min-height:36px; padding:.3rem .7rem; }
  .chip.note { color:var(--accent); border-color:var(--accent); }
  #msg { min-height:1.5rem; margin-top:.75rem; color:var(--bad); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <header><strong id="title">Revisión de oraciones</strong><span id="progress" aria-live="polite"></span></header>
  <div class="toolbar"><button id="undo" type="button">Deshacer la última decisión</button><a id="modelink" href="?mode=doubts">Ver las que dejé en duda</a></div>
  <div id="app" class="card" aria-live="polite">Cargando…</div>
  <div id="msg" role="alert"></div>
</main>
<script>
const app = document.getElementById("app"), msg = document.getElementById("msg"), progress = document.getElementById("progress");
const LEVELS = ["A1", "A2", "B1", "B2"];
const MODE = new URLSearchParams(location.search).get("mode") === "doubts" ? "doubts" : "pending";
const seen = new Set();
let queue = [], current = null, busy = false;

const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
};

async function loadStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    progress.textContent = `${s.validated || 0} validadas · ${s.rejected || 0} rechazadas · ${s.needs_review || 0} pendientes`;
  } catch (e) { progress.textContent = ""; }
}

async function nextItem() {
  msg.textContent = "";
  if (!queue.length) queue = (await (await fetch(`/api/batch?size=20&mode=${MODE}`)).json()).filter(i => !seen.has(i.id));
  current = queue.shift() || null;
  if (current) seen.add(current.id);
  loadStats();
  render();
}

async function undo() {
  if (busy) return;
  msg.textContent = "";
  const last = await (await fetch("/api/last")).json();
  if (!last) { msg.textContent = "Todavía no has decidido ninguna oración."; return; }
  if (current && current.id !== last.id) queue.unshift(current);
  current = last; seen.add(last.id);
  render();
}

function render() {
  app.replaceChildren();
  if (!current) { app.append(MODE === "doubts" ? "No tienes oraciones en duda." : "No quedan oraciones por revisar."); return; }
  const c = current;
  app.append(el("p", { className: "it", lang: "it" }, c.it), el("p", { className: "es", lang: "es" }, c.es));
  const meta = el("div", { className: "meta" },
    el("span", { className: "chip" }, `Nivel estimado ${c.cefr} (confianza ${c.cefr_confidence ?? "?"})`),
    el("span", { className: "chip" }, `Autor: ${c.author || "?"}`),
    el("a", { className: "chip", href: c.source_url, target: "_blank", rel: "noopener" }, "Ver en Tatoeba"));
  if (c.translation_kind === "pivot") meta.append(el("span", { className: "chip warn" }, "Traducción por pivote (indirecta)"));
  if (c.status !== "needs_review") meta.append(el("span", { className: "chip note" }, `Decisión anterior: ${c.status === "validated" ? "aprobada" : "rechazada"} (puedes cambiarla)`));
  for (const f of c.qa_flags) if (f !== "pivot") meta.append(el("span", { className: "chip warn" }, f));
  app.append(meta);

  if (c.tags.length) {
    const fs = el("fieldset", {}, el("legend", {}, "Códigos de error detectados (desmarca los que no apliquen)"));
    for (const t of c.tags) {
      const cb = el("input", { type: "checkbox", checked: t.accepted !== false, name: "tag", value: t.code });
      const ev = Object.entries(t.evidence).map(([k, v]) => `${k}: «${v}»`).join(" · ");
      fs.append(el("label", {}, cb, el("span", {}, t.code, el("br"), el("code", {}, `${t.rule_id}${ev ? " — " + ev : ""}`))));
    }
    app.append(fs);
  }
  const level = el("select", { id: "level", "aria-label": "Nivel corregido" }, ...LEVELS.map(l => el("option", { value: l, selected: l === c.cefr }, l)));
  app.append(el("label", {}, "Nivel correcto:", level));
  if (c.translation_kind === "pivot")
    app.append(el("label", {}, el("input", { type: "checkbox", id: "tok" }), "La traducción es correcta"));
  app.append(el("label", {}, "Motivo (opcional):", el("input", { type: "text", id: "reason", size: 30 })));
  const btn = (cls, text, key, action) => el("button", { className: cls, onclick: () => decide(action) }, text, el("kbd", {}, key));
  app.append(el("div", { className: "actions" }, btn("approve", "Aprobar", "A", "approve"), btn("reject", "Rechazar", "R", "reject"), btn("", "Dudo", "D", "doubt")));
}

async function decide(action) {
  if (busy || !current) return;
  busy = true; msg.textContent = "";
  const tags = {};
  for (const cb of app.querySelectorAll("input[name=tag]")) tags[cb.value] = cb.checked;
  const decision = { action, tags, cefr: document.getElementById("level").value, reason: document.getElementById("reason").value || undefined };
  const tok = document.getElementById("tok");
  if (tok) decision.translation_ok = tok.checked;
  try {
    const r = await fetch("/api/decision", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: current.id, decision }) });
    if (!r.ok) { msg.textContent = (await r.json()).error || "No se pudo guardar."; return; }
    await nextItem();
  } catch (e) { msg.textContent = "No se pudo guardar (¿sigue corriendo el servidor?)."; }
  finally { busy = false; }
}

document.addEventListener("keydown", e => {
  const t = document.activeElement, tag = t && t.tagName;
  if (e.ctrlKey || e.metaKey || e.altKey || tag === "SELECT" || tag === "TEXTAREA" || (tag === "INPUT" && t.type === "text")) return;
  const k = { a: "approve", r: "reject", d: "doubt" }[e.key.toLowerCase()];
  if (k) { e.preventDefault(); decide(k); }
});
document.getElementById("undo").addEventListener("click", undo);
if (MODE === "doubts") { document.getElementById("title").textContent = "Oraciones en duda"; const l = document.getElementById("modelink"); l.href = "."; l.textContent = "Volver a la revisión"; }
nextItem();
</script>
</body>
</html>
